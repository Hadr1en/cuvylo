<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Cuvylo</title>
    <meta name="description" content="Vérifiez gratuitement, sans compte, comment les logiciels de recrutement lisent votre CV. Puis créez vos CV et suivez vos candidatures. Sans IA, sans publicité." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#13213d" />
    <!-- Aperçu d'un lien partagé (réseaux sociaux, messageries). Image : scripts/build-share-images.mjs -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Cuvylo" />
    <meta property="og:locale" content="fr_FR" />
    <meta property="og:title" content="Votre CV est-il bien lu par les logiciels de recrutement ?" />
    <meta property="og:description" content="Analysez un CV PDF gratuitement et sans compte, comparez-le à une offre, puis créez vos CV et suivez vos candidatures." />
    <meta property="og:image" content="/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Cuvylo : un CV analysé, coordonnées trouvées, rubriques reconnues, un mot-clé manquant signalé." />
    <meta name="twitter:card" content="summary_large_image" />
    <script>
      // Thème appliqué avant le premier rendu pour éviter tout flash.
      try {
        var t = localStorage.getItem('cuvylo-theme')
        if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
