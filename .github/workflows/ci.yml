name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (lint, types, tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 7

  backend:
    name: Backend PHP ${{ matrix.php }} (SQLite)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.3']
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_sqlite, mbstring
          coverage: none
      - run: composer install --no-interaction --prefer-dist
      - run: php vendor/bin/phpunit

  # Les mutualisés proposent du MySQL « classique » : la suite est rejouée sur les versions les plus courantes.
  backend-mysql:
    name: Backend sur MySQL ${{ matrix.mysql }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mysql: ['5.7', '8.0']
    services:
      mysql:
        image: mysql:${{ matrix.mysql }}
        env:
          MYSQL_ROOT_PASSWORD: ci-only-root
          MYSQL_DATABASE: cuvylo_test
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pci-only-root"
          --health-interval=5s --health-timeout=5s --health-retries=30
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_mysql, mbstring
          coverage: none
      - run: composer install --no-interaction --prefer-dist
      - run: php vendor/bin/phpunit
        env:
          TEST_DB_DSN: mysql:host=127.0.0.1;port=3306;dbname=cuvylo_test;charset=utf8mb4
          TEST_DB_USER: root
          TEST_DB_PASSWORD: ci-only-root

  # Bout en bout : vrai navigateur (Chromium), build de production, API PHP réelle, MySQL.
  e2e:
    name: Bout en bout (Playwright, MySQL 8.0)
    runs-on: ubuntu-latest
    needs: [frontend]
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ci-only-root
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pci-only-root"
          --health-interval=5s --health-timeout=5s --health-retries=30
    defaults:
      run:
        working-directory: frontend
    env:
      E2E_DB_DSN: mysql:host=127.0.0.1;port=3306;dbname=cuvylo_e2e;charset=utf8mb4
      E2E_DB_USER: root
      E2E_DB_PASSWORD: ci-only-root
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_mysql, mbstring
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            frontend/playwright-report
            frontend/test-results
          retention-days: 7
