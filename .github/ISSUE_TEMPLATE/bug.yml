name: Signaler un problème
description: Quelque chose ne fonctionne pas comme prévu.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Merci ! Une faille de sécurité ? N'ouvrez pas d'issue : utilisez le [signalement privé](https://github.com/Hadr1en/cuvylo/security/advisories/new).
        N'indiquez aucune donnée personnelle réelle (CV, adresse, mot de passe…).
  - type: textarea
    id: probleme
    attributes:
      label: Que se passe-t-il ?
      description: Ce que vous avez fait, ce que vous attendiez, ce qui s'est produit.
    validations:
      required: true
  - type: textarea
    id: etapes
    attributes:
      label: Étapes pour reproduire
      placeholder: |
        1. Ouvrir …
        2. Cliquer sur …
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version de Cuvylo
      placeholder: 2.3.0
  - type: input
    id: environnement
    attributes:
      label: Hébergement et navigateur
      placeholder: Mutualisé, PHP 8.3, MySQL 8 ; Firefox 130
  - type: textarea
    id: journal
    attributes:
      label: Messages d'erreur
      description: Console du navigateur (lignes rouges) ou journal d'erreurs de l'hébergeur (lignes « cuvylo »). Retirez toute information personnelle.
      render: text
